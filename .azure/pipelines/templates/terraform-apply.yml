parameters:
  - name: environmentName
    type: string
  - name: azureSubscription
    type: string
  - name: terraformWorkingDirectory
    type: string
  - name: backendResourceGroup
    type: string
  - name: backendStorageAccount
    type: string
  - name: backendContainer
    type: string
  - name: backendKey
    type: string
  - name: terraformVersion
    type: string
    default: "1.9.8"
  - name: apply
    type: boolean
    default: true

steps:
  - bash: |
      set -euo pipefail
      curl -fsSL "https://releases.hashicorp.com/terraform/${{ parameters.terraformVersion }}/terraform_${{ parameters.terraformVersion }}_linux_amd64.zip" -o /tmp/terraform.zip
      sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
      terraform version
    displayName: Install Terraform ${{ parameters.terraformVersion }}

  # AzureCLI logs in as a service principal. Terraform cannot use "az login" SP sessions
  # (CLI auth is user-only), so we wire OIDC / ARM_* for the azurerm provider + backend.
  - task: AzureCLI@2
    displayName: Terraform init / plan (${{ parameters.environmentName }})
    inputs:
      azureSubscription: ${{ parameters.azureSubscription }}
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      workingDirectory: ${{ parameters.terraformWorkingDirectory }}
      inlineScript: |
        set -euo pipefail

        export ARM_USE_OIDC=true
        export ARM_CLIENT_ID="${AZURESUBSCRIPTION_CLIENT_ID:-${servicePrincipalId:-}}"
        export ARM_TENANT_ID="${AZURESUBSCRIPTION_TENANT_ID:-${tenantId:-}}"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export ARM_OIDC_AZURE_SERVICE_CONNECTION_ID="${AZURESUBSCRIPTION_SERVICE_CONNECTION_ID:-}"

        if [[ -z "${ARM_CLIENT_ID}" || -z "${ARM_TENANT_ID}" ]]; then
          echo "##vso[task.logissue type=error]Missing ARM_CLIENT_ID / ARM_TENANT_ID from the Azure service connection."
          exit 1
        fi

        # Older agents: fall back to the one-shot federated token from addSpnToEnvironment
        if [[ -z "${ARM_OIDC_REQUEST_TOKEN:-}" && -n "${idToken:-}" ]]; then
          export ARM_OIDC_TOKEN="${idToken}"
        fi

        echo "Terraform auth: subscription=${ARM_SUBSCRIPTION_ID} client=${ARM_CLIENT_ID} oidc=true"

        terraform init \
          -input=false \
          -backend-config="resource_group_name=${{ parameters.backendResourceGroup }}" \
          -backend-config="storage_account_name=${{ parameters.backendStorageAccount }}" \
          -backend-config="container_name=${{ parameters.backendContainer }}" \
          -backend-config="key=${{ parameters.backendKey }}" \
          -backend-config="use_azuread_auth=true"

        terraform validate

        terraform plan \
          -input=false \
          -var-file="environments/${{ parameters.environmentName }}.tfvars" \
          -out="tfplan-${{ parameters.environmentName }}"
    env:
      ARM_OIDC_REQUEST_TOKEN: $(System.AccessToken)

  - ${{ if parameters.apply }}:
    - task: AzureCLI@2
      displayName: Terraform apply (${{ parameters.environmentName }})
      inputs:
        azureSubscription: ${{ parameters.azureSubscription }}
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        workingDirectory: ${{ parameters.terraformWorkingDirectory }}
        inlineScript: |
          set -euo pipefail

          export ARM_USE_OIDC=true
          export ARM_CLIENT_ID="${AZURESUBSCRIPTION_CLIENT_ID:-${servicePrincipalId:-}}"
          export ARM_TENANT_ID="${AZURESUBSCRIPTION_TENANT_ID:-${tenantId:-}}"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          export ARM_OIDC_AZURE_SERVICE_CONNECTION_ID="${AZURESUBSCRIPTION_SERVICE_CONNECTION_ID:-}"

          if [[ -z "${ARM_OIDC_REQUEST_TOKEN:-}" && -n "${idToken:-}" ]]; then
            export ARM_OIDC_TOKEN="${idToken}"
          fi

          terraform apply \
            -input=false \
            -auto-approve \
            "tfplan-${{ parameters.environmentName }}"
      env:
        ARM_OIDC_REQUEST_TOKEN: $(System.AccessToken)
