parameters:
  - name: environmentName
    type: string
  - name: azureSubscription
    type: string
  - name: terraformWorkingDirectory
    type: string
  - name: backendResourceGroup
    type: string
  - name: backendStorageAccount
    type: string
  - name: backendContainer
    type: string
  - name: backendKey
    type: string
  - name: terraformVersion
    type: string
    default: "1.9.8"
  - name: apply
    type: boolean
    default: true

steps:
  - bash: |
      set -euo pipefail
      curl -fsSL "https://releases.hashicorp.com/terraform/${{ parameters.terraformVersion }}/terraform_${{ parameters.terraformVersion }}_linux_amd64.zip" -o /tmp/terraform.zip
      sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
      terraform version
    displayName: Install Terraform ${{ parameters.terraformVersion }}

  # AzureCLI@2 logs in as a service principal. azurerm cannot use Azure CLI SP sessions
  # ("only supported as a User"). Force OIDC and disable CLI auth for Terraform.
  - task: AzureCLI@2
    displayName: Terraform init / plan (${{ parameters.environmentName }})
    inputs:
      azureSubscription: ${{ parameters.azureSubscription }}
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      workingDirectory: ${{ parameters.terraformWorkingDirectory }}
      # Keep compile-time template expressions out of inlineScript: any such
      # expression wraps the whole script in format() and then bash ${var}/if
      # are misparsed as expressions. Pass values via env instead.
      inlineScript: |
        set -euo pipefail

        # Prefer task-injected WIF vars; fall back to addSpnToEnvironment names.
        CLIENT_ID="${AZURESUBSCRIPTION_CLIENT_ID:-}"
        TENANT_ID="${AZURESUBSCRIPTION_TENANT_ID:-}"
        SC_ID="${AZURESUBSCRIPTION_SERVICE_CONNECTION_ID:-}"
        [[ -z "${CLIENT_ID}" && -n "${servicePrincipalId:-}" ]] && CLIENT_ID="${servicePrincipalId}"
        [[ -z "${TENANT_ID}" && -n "${tenantId:-}" ]] && TENANT_ID="${tenantId}"

        SUB_ID="$(az account show --query id -o tsv)"

        echo "Auth diagnostics (presence only):"
        echo "  CLIENT_ID set: $([[ -n "${CLIENT_ID}" ]] && echo yes || echo no)"
        echo "  TENANT_ID set: $([[ -n "${TENANT_ID}" ]] && echo yes || echo no)"
        echo "  SUB_ID set: $([[ -n "${SUB_ID}" ]] && echo yes || echo no)"
        echo "  idToken set: $([[ -n "${idToken:-}" ]] && echo yes || echo no)"
        echo "  ARM_OIDC_REQUEST_TOKEN set: $([[ -n "${ARM_OIDC_REQUEST_TOKEN:-}" ]] && echo yes || echo no)"
        echo "  service connection id set: $([[ -n "${SC_ID}" ]] && echo yes || echo no)"

        if [[ -z "${CLIENT_ID}" || -z "${TENANT_ID}" || -z "${SUB_ID}" ]]; then
          echo "##vso[task.logissue type=error]Missing ARM client/tenant/subscription for Terraform OIDC."
          exit 1
        fi

        export ARM_USE_CLI=false
        export ARM_USE_OIDC=true
        export ARM_CLIENT_ID="${CLIENT_ID}"
        export ARM_TENANT_ID="${TENANT_ID}"
        export ARM_SUBSCRIPTION_ID="${SUB_ID}"

        if [[ -n "${SC_ID}" ]]; then
          export ARM_OIDC_AZURE_SERVICE_CONNECTION_ID="${SC_ID}"
        fi

        # One-shot federated token from AzureCLI (most reliable with WIF + this task)
        if [[ -n "${idToken:-}" ]]; then
          export ARM_OIDC_TOKEN="${idToken}"
        fi

        if [[ -z "${ARM_OIDC_TOKEN:-}" && -z "${ARM_OIDC_REQUEST_TOKEN:-}" ]]; then
          echo "##vso[task.logissue type=error]No OIDC token available (idToken / System.AccessToken). Check WIF service connection."
          exit 1
        fi

        echo "Terraform auth: subscription=${ARM_SUBSCRIPTION_ID} use_oidc=true use_cli=false"

        # TF_APPLY comes from task env (Azure DevOps booleans are True/False).
        if [[ "${TF_APPLY}" == [Tt]rue ]]; then
          LOCK_ARGS=(-lock=true -lock-timeout=600s)
          PLAN_MAX_ATTEMPTS=3
        else
          LOCK_ARGS=(-lock=false)
          PLAN_MAX_ATTEMPTS=2
          echo "PR/plan-only mode: state locking disabled (-lock=false)."
        fi

        terraform init \
          -input=false \
          -reconfigure \
          "${LOCK_ARGS[@]}" \
          -backend-config="resource_group_name=${TF_BACKEND_RESOURCE_GROUP}" \
          -backend-config="storage_account_name=${TF_BACKEND_STORAGE_ACCOUNT}" \
          -backend-config="container_name=${TF_BACKEND_CONTAINER}" \
          -backend-config="key=${TF_BACKEND_KEY}" \
          -backend-config="use_azuread_auth=true"

        terraform validate

        # Dead Microsoft-hosted agents sometimes leave OperationTypePlan leases forever.
        # Safe to force-unlock those; never auto-unlock OperationTypeApply.
        release_orphaned_plan_lock() {
          set +e
          local out
          out="$(terraform plan \
            -input=false \
            -lock=true \
            -lock-timeout=0s \
            -refresh=false \
            -var-file="environments/${TF_ENVIRONMENT_NAME}.tfvars" 2>&1)"
          local ec=$?
          set -e
          if [[ "${ec}" -eq 0 || "${ec}" -eq 2 ]]; then
            return 0
          fi
          if ! grep -q "Error acquiring the state lock" <<<"${out}"; then
            return 0
          fi
          if ! grep -q "OperationTypePlan" <<<"${out}"; then
            echo "State lock is not OperationTypePlan; leaving it alone."
            echo "${out}" | tail -n 30
            return 0
          fi
          local lock_id
          # Terraform wraps diagnostic lines with "│ "; match ID anywhere on the line.
          lock_id="$(grep -oE 'ID:[[:space:]]*[0-9a-fA-F-]{36}' <<<"${out}" | head -n 1 | awk '{print $2}')"
          if [[ -z "${lock_id}" ]]; then
            echo "Could not parse lock ID from terraform output."
            echo "${out}" | tail -n 40
            return 0
          fi
          local created_raw created_norm created_epoch now_epoch age_sec
          created_raw="$(grep -oE 'Created:[[:space:]]*[0-9]{4}-[0-9]{2}-[0-9]{2} [^│]+' <<<"${out}" | head -n 1 | sed -E 's/^Created:[[:space:]]*//; s/[[:space:]]+$//')"
          # Terraform prints "2026-08-16 02:26:17.97991911 +0000 UTC".
          # GNU date rejects "+0000 UTC" together; keep "YYYY-MM-DD HH:MM:SS UTC".
          created_norm="$(echo "${created_raw}" | sed -E 's/^([0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}).*/\1 UTC/')"
          created_epoch="$(date -u -d "${created_norm}" +%s 2>/dev/null || echo 0)"
          now_epoch="$(date -u +%s)"
          age_sec=$((now_epoch - created_epoch))
          if [[ "${created_epoch}" -le 0 ]]; then
            # Parsing failed: still clear OperationTypePlan leases so dead-agent
            # locks cannot block the pipeline indefinitely.
            echo "Could not parse plan lock Created timestamp [${created_raw}]; force-unlocking OperationTypePlan lock ${lock_id}."
            terraform force-unlock -force "${lock_id}"
            return 0
          fi
          if [[ "${age_sec}" -lt 1200 ]]; then
            echo "Plan lock ${lock_id} is recent (age=${age_sec}s); not force-unlocking."
            return 0
          fi
          echo "Releasing orphaned plan lock ${lock_id} (created=${created_norm}, age ${age_sec}s)…"
          terraform force-unlock -force "${lock_id}"
        }

        release_orphaned_plan_lock || true

        # terraform plan exits 0 (no changes) or 2 (changes present) on success.
        # Exit 1 is a real error. Under set -e, exit 2 must not fail the job.
        run_terraform_plan() {
          set +e
          terraform plan \
            -input=false \
            "${LOCK_ARGS[@]}" \
            -var-file="environments/${TF_ENVIRONMENT_NAME}.tfvars" \
            -out="tfplan-${TF_ENVIRONMENT_NAME}"
          local plan_exit=$?
          set -e
          if [[ "${plan_exit}" -eq 0 || "${plan_exit}" -eq 2 ]]; then
            echo "terraform plan succeeded (exit ${plan_exit})."
            return 0
          fi
          echo "terraform plan failed (exit ${plan_exit})."
          return "${plan_exit}"
        }

        plan_attempt=1
        until run_terraform_plan; do
          if [[ "${plan_attempt}" -ge "${PLAN_MAX_ATTEMPTS}" ]]; then
            echo "##vso[task.logissue type=error]terraform plan failed after ${plan_attempt} attempts."
            exit 1
          fi
          echo "Retrying terraform plan in 20s (attempt ${plan_attempt})…"
          plan_attempt=$((plan_attempt + 1))
          sleep 20
        done
    env:
      ARM_OIDC_REQUEST_TOKEN: $(System.AccessToken)
      TF_APPLY: ${{ parameters.apply }}
      TF_ENVIRONMENT_NAME: ${{ parameters.environmentName }}
      TF_BACKEND_RESOURCE_GROUP: ${{ parameters.backendResourceGroup }}
      TF_BACKEND_STORAGE_ACCOUNT: ${{ parameters.backendStorageAccount }}
      TF_BACKEND_CONTAINER: ${{ parameters.backendContainer }}
      TF_BACKEND_KEY: ${{ parameters.backendKey }}

  - ${{ if parameters.apply }}:
    - task: AzureCLI@2
      displayName: Terraform apply (${{ parameters.environmentName }})
      inputs:
        azureSubscription: ${{ parameters.azureSubscription }}
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        workingDirectory: ${{ parameters.terraformWorkingDirectory }}
        inlineScript: |
          set -euo pipefail

          CLIENT_ID="${AZURESUBSCRIPTION_CLIENT_ID:-}"
          TENANT_ID="${AZURESUBSCRIPTION_TENANT_ID:-}"
          SC_ID="${AZURESUBSCRIPTION_SERVICE_CONNECTION_ID:-}"
          [[ -z "${CLIENT_ID}" && -n "${servicePrincipalId:-}" ]] && CLIENT_ID="${servicePrincipalId}"
          [[ -z "${TENANT_ID}" && -n "${tenantId:-}" ]] && TENANT_ID="${tenantId}"
          SUB_ID="$(az account show --query id -o tsv)"

          export ARM_USE_CLI=false
          export ARM_USE_OIDC=true
          export ARM_CLIENT_ID="${CLIENT_ID}"
          export ARM_TENANT_ID="${TENANT_ID}"
          export ARM_SUBSCRIPTION_ID="${SUB_ID}"
          [[ -n "${SC_ID}" ]] && export ARM_OIDC_AZURE_SERVICE_CONNECTION_ID="${SC_ID}"
          [[ -n "${idToken:-}" ]] && export ARM_OIDC_TOKEN="${idToken}"

          terraform apply \
            -input=false \
            -auto-approve \
            -lock-timeout=600s \
            "tfplan-${TF_ENVIRONMENT_NAME}"
      env:
        ARM_OIDC_REQUEST_TOKEN: $(System.AccessToken)
        TF_ENVIRONMENT_NAME: ${{ parameters.environmentName }}
