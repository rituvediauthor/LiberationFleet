# LiberationFleet — Azure DevOps CI/CD
#
# Stages: Build → Deploy staging (optional) → Deploy production (opt-in)
#
# Deploy model (cost + control):
# - Push to master → Build + Deploy staging (unless STAGING_ENABLED=false).
# - Production never deploys on push. Run the pipeline manually and check
#   "Deploy to production" when you are ready (Environment approval still applies).
# - When staging is paused/destroyed, set liberationfleet-staging → STAGING_ENABLED=false
#   so master pushes do not recreate staging; then use a manual run with
#   "Deploy to production" only.
#
# Setup (once): see docs/AZURE-GO-LIVE.md and .azure/pipelines/README.md

parameters:
  - name: deployProduction
    displayName: Deploy to production (after build; only when you are ready)
    type: boolean
    default: false

trigger:
  branches:
    include:
      - master
  paths:
    exclude:
      - docs/**
      - "**/*.md"

pr:
  branches:
    include:
      - master

stages:
  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    - stage: PRGate
      displayName: PR gate
      jobs:
        - job: Acknowledge
          displayName: PR validation is on GitHub Actions
          # Agentless: does not require Microsoft-hosted parallel jobs.
          pool: server
          steps:
            - task: Delay@1
              displayName: Acknowledge (see workflow Build and test)
              inputs:
                delayForMinutes: "0"

  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - stage: Build
      displayName: Build and test
      variables:
        - group: liberationfleet-shared
        - name: imageRepository
          value: liberationfleet
        - name: dockerfilePath
          value: LiberationFleet.Server/Dockerfile
        - name: terraformWorkingDirectory
          value: $(Build.SourcesDirectory)/infrastructure/terraform
        - name: dotnetVersion
          value: "10.0.x"
        - name: vmImage
          value: ubuntu-latest
      jobs:
        - job: BuildTest
          displayName: Restore, build, test
          pool:
            vmImage: $(vmImage)
          steps:
            - checkout: self
              fetchDepth: 0

            - task: UseDotNet@2
              displayName: Use .NET SDK
              inputs:
                packageType: sdk
                version: $(dotnetVersion)
                includePreviewVersions: true

            - task: DotNetCoreCLI@2
              displayName: Restore
              inputs:
                command: restore
                projects: |
                  LiberationFleet.Server/LiberationFleet.Server.csproj
                  LiberationFleet.Server.Tests/LiberationFleet.Server.Tests.csproj
                arguments: "/p:SkipSpaProjectReference=true"

            - task: DotNetCoreCLI@2
              displayName: Build
              inputs:
                command: build
                projects: |
                  LiberationFleet.Server/LiberationFleet.Server.csproj
                  LiberationFleet.Server.Tests/LiberationFleet.Server.Tests.csproj
                arguments: "--configuration Release --no-restore /p:SkipSpaProjectReference=true"

            - task: DotNetCoreCLI@2
              displayName: Test
              inputs:
                command: test
                projects: "LiberationFleet.Server.Tests/LiberationFleet.Server.Tests.csproj"
                arguments: "--configuration Release --no-build --collect:\"XPlat Code Coverage\""
                publishTestResults: true

            - script: |
                set -euo pipefail
                IMAGE_TAG="$(Build.SourceVersion)"
                echo "##vso[task.setvariable variable=ImageTag;isOutput=true]${IMAGE_TAG:0:12}"
                echo "##vso[task.setvariable variable=ImageTag]${IMAGE_TAG:0:12}"
              name: setTag
              displayName: Compute image tag

            - task: Docker@2
              displayName: Build image (no push)
              inputs:
                command: build
                repository: $(imageRepository)
                dockerfile: $(dockerfilePath)
                buildContext: $(Build.SourcesDirectory)
                tags: |
                  $(ImageTag)
                  latest
                arguments: --pull

    - stage: DeployStaging
      displayName: Deploy staging
      dependsOn: Build
      # STAGING_ENABLED comes from liberationfleet-staging (linked on this stage).
      # Missing/empty is treated as enabled. Set false when staging is destroyed (Step 13).
      condition: |
        and(
          succeeded(),
          eq(variables['Build.SourceBranch'], 'refs/heads/master'),
          ne(variables['STAGING_ENABLED'], 'false')
        )
      variables:
        - group: liberationfleet-shared
        - group: liberationfleet-staging
        - name: imageRepository
          value: liberationfleet
        - name: dockerfilePath
          value: LiberationFleet.Server/Dockerfile
        - name: terraformWorkingDirectory
          value: $(Build.SourcesDirectory)/infrastructure/terraform
        - name: ImageTag
          value: $[ stageDependencies.Build.BuildTest.outputs['setTag.ImageTag'] ]
      jobs:
        - deployment: Staging
          displayName: Staging infra + app
          environment: staging
          pool:
            vmImage: ubuntu-latest
          # Belt-and-suspenders if stage condition cannot see the variable group.
          condition: ne(variables['STAGING_ENABLED'], 'false')
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self
                    # Needed so System.AccessToken / OIDC refresh can be used by Terraform
                    persistCredentials: true

                  - template: .azure/pipelines/templates/terraform-apply.yml
                    parameters:
                      environmentName: staging
                      azureSubscription: azure-liberationfleet
                      terraformWorkingDirectory: $(terraformWorkingDirectory)
                      backendResourceGroup: $(TF_STATE_RG)
                      backendStorageAccount: $(TF_STATE_STORAGE)
                      backendContainer: $(TF_STATE_CONTAINER)
                      backendKey: staging.terraform.tfstate
                      apply: true

                  - template: .azure/pipelines/templates/docker-push-deploy.yml
                    parameters:
                      azureSubscription: azure-liberationfleet
                      acrName: $(ACR_NAME)
                      acrLoginServer: $(ACR_LOGIN_SERVER)
                      imageRepository: $(imageRepository)
                      imageTag: $(ImageTag)
                      resourceGroup: $(AZURE_RESOURCE_GROUP)
                      webAppName: $(WEB_APP_NAME)
                      dockerfilePath: $(dockerfilePath)

    - stage: DeployProduction
      displayName: Deploy production
      dependsOn:
        - Build
        - DeployStaging
      # Opt-in only: Run pipeline → check "Deploy to production". Never on plain push.
      # Staging may be Skipped when STAGING_ENABLED=false (prod-only ship while staging paused).
      condition: |
        and(
          eq(variables['Build.SourceBranch'], 'refs/heads/master'),
          eq('${{ parameters.deployProduction }}', 'true'),
          in(dependencies.Build.result, 'Succeeded'),
          in(dependencies.DeployStaging.result, 'Succeeded', 'Skipped')
        )
      variables:
        - group: liberationfleet-shared
        - group: liberationfleet-production
        - name: imageRepository
          value: liberationfleet
        - name: dockerfilePath
          value: LiberationFleet.Server/Dockerfile
        - name: terraformWorkingDirectory
          value: $(Build.SourcesDirectory)/infrastructure/terraform
        - name: ImageTag
          value: $[ stageDependencies.Build.BuildTest.outputs['setTag.ImageTag'] ]
      jobs:
        - deployment: Production
          displayName: Production infra + app
          environment: production
          pool:
            vmImage: ubuntu-latest
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self
                    persistCredentials: true

                  - template: .azure/pipelines/templates/terraform-apply.yml
                    parameters:
                      environmentName: production
                      azureSubscription: azure-liberationfleet
                      terraformWorkingDirectory: $(terraformWorkingDirectory)
                      backendResourceGroup: $(TF_STATE_RG)
                      backendStorageAccount: $(TF_STATE_STORAGE)
                      backendContainer: $(TF_STATE_CONTAINER)
                      backendKey: production.terraform.tfstate
                      apply: true

                  - template: .azure/pipelines/templates/docker-push-deploy.yml
                    parameters:
                      azureSubscription: azure-liberationfleet
                      acrName: $(ACR_NAME)
                      acrLoginServer: $(ACR_LOGIN_SERVER)
                      imageRepository: $(imageRepository)
                      imageTag: $(ImageTag)
                      resourceGroup: $(AZURE_RESOURCE_GROUP)
                      webAppName: $(WEB_APP_NAME)
                      dockerfilePath: $(dockerfilePath)
