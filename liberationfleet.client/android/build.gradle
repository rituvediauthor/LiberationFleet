// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// @honem/native-video-compressor hardcodes minSdk 22. Capacitor 6 is 24, so
// "Assemble Project with Tests" fails merging that plugin's androidTest manifest.
subprojects { sub ->
    sub.afterEvaluate {
        if (sub.name != 'honem-native-video-compressor') {
            return
        }
        def androidExt = sub.extensions.findByName('android')
        if (androidExt == null) {
            return
        }
        androidExt.defaultConfig.minSdk = rootProject.ext.minSdkVersion
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
