<ng-container *ngIf="loadError; else ready">
  <div class="hero">
    <h1>Couldn't load your crew</h1>
    <p class="subtitle">We couldn't confirm your crew membership. Try again before creating or joining another crew.</p>
  </div>
  <div class="actions">
    <button type="button" class="action-btn primary" (click)="retry.emit()">Try again</button>
  </div>
</ng-container>

<ng-template #ready>
  <div class="hero">
    <h1>Welcome to LiberationFleet</h1>
    <p class="subtitle">{{ subtitle }}</p>
  </div>

  <div class="actions">
    <button type="button" class="action-btn primary" (click)="createCrew.emit()">Create Crew</button>
    <button type="button" class="action-btn secondary" (click)="joinCrew.emit()">Join Crew</button>
    <button type="button" class="action-btn secondary" (click)="invitations.emit()">My Invitations</button>
    <button type="button" class="action-btn secondary" (click)="joinRequests.emit()">My Join Requests</button>
    <button
      type="button"
      class="action-btn secondary"
      [disabled]="!hasCrew"
      (click)="crewDashboard.emit()">
      Crew Dashboard
    </button>
    <button type="button" class="action-btn secondary" (click)="howToUse.emit()">How to use this app</button>
  </div>
</ng-template>
