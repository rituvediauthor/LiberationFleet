<app-page-layout
  [showFallibleFooter]="false"
  [backButton]="backButton"
  [fillHeight]="true"
  [locationHeader]="statusPageLabel">
  <div class="proposals-list-page">
    <label class="filter-label" for="proposal-kind-filter">Filter</label>
    <select
      id="proposal-kind-filter"
      class="filter-select"
      [value]="selectedKind"
      (change)="onKindFilterChange($any($event.target).value)">
      <option value="">All types</option>
      <option *ngFor="let option of kindOptions" [value]="option.value">{{ option.label }}</option>
    </select>

    <p *ngIf="loading" class="state-text">Loading proposals...</p>
    <p *ngIf="!loading && errorMessage" class="state-text error">{{ errorMessage }}</p>
    <p *ngIf="!loading && !errorMessage && items.length === 0" class="state-text">No proposals yet.</p>
    <p *ngIf="!loading && !errorMessage && items.length > 0 && filteredItems.length === 0" class="state-text">
      No proposals match this type.
    </p>

    <div class="proposal-cards" *ngIf="!loading && filteredItems.length > 0">
      <button
        type="button"
        class="proposal-card"
        *ngFor="let item of filteredItems"
        [lfNotificationTarget]="item.id"
        [lfNotificationPrefix]="notifyPrefix"
        [lfHighlightId]="highlightId"
        (click)="openProposal(item)">
        <span class="entry-badge-anchor">
          <app-content-badge [count]="proposalBadgeCount(item.id)"></app-content-badge>
        </span>
        <div class="card-top">
          <div class="card-main">
            <p class="card-meta">
              <span class="author">{{ item.authorUsername }}</span>
              <span class="dot">·</span>
              <span>{{ formatActivity(item.lastActivityAt) }}</span>
              <ng-container *ngIf="kindLabel(item.kind) as label">
                <span class="dot">·</span>
                <span class="kind-label">{{ label }}</span>
              </ng-container>
            </p>
            <h2 class="card-title">{{ item.title || 'Untitled proposal' }}</h2>
            <p class="card-preview">{{ item.descriptionPreview || '' }}</p>
            <p class="vote-line">
              <span class="approve">{{ item.approveCount }} approve</span>
              <span class="disapprove">{{ item.disapproveCount }} disapprove</span>
            </p>
            <p class="timer" *ngIf="countdownText(item) as countdown">
              Auto-resolves in {{ countdown }}
            </p>
          </div>
          <div class="card-thumb" *ngIf="item.thumbnailUrl || item.hasVideoAttachment">
            <img *ngIf="item.thumbnailUrl" [src]="item.thumbnailUrl" alt="" />
            <span class="card-thumb-play" *ngIf="item.hasVideoAttachment" aria-hidden="true">
              <i class="fa-solid fa-play"></i>
            </span>
          </div>
        </div>
      </button>
    </div>
  </div>
</app-page-layout>
