<app-page-layout [showFallibleFooter]="false" [backButton]="backButton" [primaryButton]="createButton">
  <div class="discussion-create-page">
    <h1 class="page-title">Create Post</h1>

    <form [formGroup]="form">
      <div class="form-group">
        <label for="title">Title</label>
        <input
          id="title"
          class="form-input"
          type="text"
          formControlName="title"
          placeholder="Post title"
          [maxlength]="titleMaxLength"
          [attr.aria-invalid]="isInvalid('title')"
          [attr.aria-describedby]="isInvalid('title') ? 'title-error' : null" />
        <app-char-counter [current]="form.get('title')?.value?.length || 0" [max]="titleMaxLength"></app-char-counter>
        <span id="title-error" class="error-text" role="alert" *ngIf="isInvalid('title')">
          Title is required
        </span>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          class="form-input textarea"
          rows="8"
          formControlName="description"
          appMentionAutocomplete
          [(mentionedUserIds)]="mentionedUserIds"
          placeholder="Write your post"
          [maxlength]="descriptionMaxLength"
          [attr.aria-invalid]="isInvalid('description')"
          [attr.aria-describedby]="isInvalid('description') ? 'description-error' : null"></textarea>
        <app-char-counter [current]="form.get('description')?.value?.length || 0" [max]="descriptionMaxLength"></app-char-counter>
        <span id="description-error" class="error-text" role="alert" *ngIf="isInvalid('description')">
          Description is required
        </span>
      </div>

      <app-proposal-attachment-picker
        *ngIf="canAttachFiles"
        [attachments]="attachments"
        [maxAttachments]="20"
        [cryptoScope]="fleetId > 0 ? { fleetId: fleetId } : null"
        (attachmentsChange)="onAttachmentsChange()">
      </app-proposal-attachment-picker>
      <app-attach-permission-note *ngIf="!canAttachFiles" scope="fleet"></app-attach-permission-note>

      <label class="checkbox-field">
        <input type="checkbox" formControlName="isAdultContent" />
        <span>18+ — contains adult or graphic content</span>
      </label>
    </form>
  </div>
</app-page-layout>
