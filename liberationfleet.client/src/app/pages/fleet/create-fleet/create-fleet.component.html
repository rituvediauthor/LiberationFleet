<app-page-layout [showFallibleFooter]="false" [backButton]="backButton" [primaryButton]="isLoading ? null : createButton">
  <app-hub-loading *ngIf="isLoading" variant="fleet" label="Creating fleet..."></app-hub-loading>

  <div class="form-container" *ngIf="!isLoading">
    <div class="form-card">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name">Fleet Name</label>
          <input
            id="name"
            type="text"
            formControlName="name"
            class="form-input"
            placeholder="Enter fleet name"
            [maxlength]="nameMaxLength"
            [attr.aria-invalid]="isInvalid('name')"
            [attr.aria-describedby]="isInvalid('name') ? 'name-error' : null">
          <app-char-counter [current]="form.get('name')?.value?.length || 0" [max]="nameMaxLength"></app-char-counter>
          <span id="name-error" class="error-text" role="alert" *ngIf="isInvalid('name')">
            Fleet name is required
          </span>
        </div>

        <div class="form-group">
          <label for="privacy">Privacy</label>
          <select id="privacy" formControlName="privacy" class="form-input" aria-describedby="privacy-hint">
            <option value="Public">Public</option>
            <option value="Private">Private</option>
            <option value="InviteOnly">Invite Only</option>
          </select>
          <span class="hint-text" id="privacy-hint">
            Public appears in search. Private is findable only with the full join code. Invite Only cannot be searched — a crew must be invited.
          </span>
        </div>

        <div class="form-group">
          <label for="scope">Location Type</label>
          <select id="scope" formControlName="scope" class="form-input">
            <option value="Online">Online</option>
            <option value="Local">Local</option>
          </select>
        </div>

        <ng-container *ngIf="isLocal">
          <div class="form-group">
            <app-country-select
              [countryCode]="form.get('countryCode')?.value"
              (countryCodeChange)="onCountryCodeChange($event)"
              [required]="true"
              [allowClear]="false"
              [showError]="isInvalid('countryCode')"
              hint="Must match members' profile country for Local discovery.">
            </app-country-select>
          </div>

          <div class="form-group">
            <app-zip-code-list-editor
              [zipCodes]="form.get('allowedZipCodes')?.value || []"
              (zipCodesChange)="onAllowedZipCodesChange($event)"
              [showError]="isInvalid('allowedZipCodes')"
              hint="People whose profile country and postal code match an entry in this list can find and join this Local fleet.">
            </app-zip-code-list-editor>
          </div>
        </ng-container>
      </form>
    </div>
  </div>
</app-page-layout>
