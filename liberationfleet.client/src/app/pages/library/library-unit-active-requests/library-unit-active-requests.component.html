<app-page-layout [backButton]="backButton" [fillHeight]="true">
  <div class="library-list-page">
    <p class="page-note">All open requests for this item</p>

    <p *ngIf="loading" class="state-text">Loading...</p>
    <p *ngIf="!loading && errorMessage" class="state-text error">{{ errorMessage }}</p>
    <p *ngIf="!loading && !errorMessage && items.length === 0" class="state-text">No open requests.</p>

    <div class="item-cards" *ngIf="!loading && items.length > 0">
      <button type="button" class="item-card-button" *ngFor="let item of items" (click)="openRequest(item)">
        <app-library-item-card [item]="toCardItem(item)" holderLabel="Requester"></app-library-item-card>
        <div class="request-meta">
          <span class="date-range">{{ formatDateRange(item) }}</span>
          <span class="priority-score" *ngIf="item.requesterPriorityScore != null">
            Priority score: {{ item.requesterPriorityScore }}
          </span>
          <span class="priority-note highest" *ngIf="item.hasHighestPriorityAmongOpenRequests">
            This crewmate has highest priority
          </span>
          <button
            type="button"
            class="priority-note link-btn"
            *ngIf="item.hasHighestPriorityAmongOpenRequests === false && item.higherPriorityRequestId"
            (click)="openHigherPriorityRequest($event, item)">
            Lower priority score than {{ item.higherPriorityRequesterUsername }}
          </button>
        </div>
      </button>
    </div>
  </div>
</app-page-layout>
