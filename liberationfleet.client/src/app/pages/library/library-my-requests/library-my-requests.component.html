<app-page-layout [backButton]="backButton" [fillHeight]="true">
  <div class="library-list-page">
    <h1 class="page-title">My Requests</h1>
    <p class="intro-text">Choose a status to view those requests.</p>

    <div class="status-hub">
      <button type="button" class="status-hub-btn" (click)="openPending()">
        <span>Pending</span>
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
      <button type="button" class="status-hub-btn" (click)="openFulfilled()">
        <span>Fulfilled</span>
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
      <button type="button" class="status-hub-btn" (click)="openDenied()">
        <span>Denied</span>
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</app-page-layout>
