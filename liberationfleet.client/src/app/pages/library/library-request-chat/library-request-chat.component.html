<div class="chat-text-page">
  <app-location-header *ngIf="locationHeaderView" [info]="locationHeaderView"></app-location-header>

  <div class="message-scroll" #messageScroll>
    <div class="scroll-page-body chat-channel-body">
      <p class="state-text" *ngIf="loading">Loading messages...</p>
      <p class="state-text error" *ngIf="!loading && loadError">{{ loadError }}</p>
      <p class="state-text" *ngIf="loadingOlder">Loading older messages...</p>

      <div class="message-list" *ngIf="!loading && !loadError">
        <article
          #messageItem
          class="message-bubble"
          *ngFor="let message of messages"
          [class.own]="isOwnMessage(message)"
          [class.media-primary]="!message.body && (message.resolvedAttachments?.length ?? 0) > 0">
          <p class="message-meta">
            <strong>{{ message.authorUsername }}</strong>
            <span>·</span>
            <span>{{ message.createdAt | date:'short' }}</span>
          </p>
          <p class="message-body" *ngIf="message.body"><app-mention-text [text]="message.body" /></p>
          <app-proposal-attachment-display
            [attachments]="message.resolvedAttachments ?? []"
            [compact]="true"
            [crewId]="crewId">
          </app-proposal-attachment-display>
        </article>
      </div>
    </div>
  </div>

  <div class="chat-action-bar" [appComposerFooterPad]="messageScroll">
    <div class="chat-action-bar-inner">
      <button
        type="button"
        class="back-btn"
        (click)="onBackAction()"
        [attr.aria-label]="composerExpanded ? 'Minimize writing area' : 'Go back'">
        <i
          class="fa-solid"
          [class.fa-angle-down]="composerExpanded"
          [class.fa-angle-left]="!composerExpanded"
          aria-hidden="true"></i>
      </button>

      <div class="composer" [class.expanded]="composerExpanded">
        <div class="composer-input-row">
          <textarea
            class="message-input"
            [class.expanded]="composerExpanded"
            [(ngModel)]="messageText"
            appMentionAutocomplete
            [(mentionedUserIds)]="mentionedUserIds"
            (focus)="onComposerFocus()"
            (blur)="onComposerBlur()"
            placeholder="Message..."
            aria-label="Message"
            [attr.maxlength]="messageMaxLength"
            rows="1"></textarea>

          <div class="composer-actions-col" *ngIf="composerExpanded">
            <button
              type="button"
              class="composer-send-btn"
              [disabled]="sending || !canSend()"
              (click)="sendMessage()"
              aria-label="Send">
              <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="composer-tools" [class.collapsed-tools]="!composerExpanded">
          <app-proposal-attachment-picker
            *ngIf="canAttachFiles"
            class="message-attachment-picker"
            [class.collapsed]="!composerExpanded"
            [attachments]="messageAttachments"
            [cryptoScope]="crewId > 0 ? { crewId: crewId } : null"
            (fileDialogOpenChange)="onFileDialogOpenChange($event)"
            (attachmentsChange)="onAttachmentsChange()">
          </app-proposal-attachment-picker>
          <app-char-counter
            [current]="messageText.length"
            [max]="messageMaxLength">
          </app-char-counter>
          <app-attach-permission-note
            *ngIf="!canAttachFiles"
            class="composer-permission-note"
            scope="crew">
          </app-attach-permission-note>
        </div>
      </div>
    </div>
  </div>
</div>
