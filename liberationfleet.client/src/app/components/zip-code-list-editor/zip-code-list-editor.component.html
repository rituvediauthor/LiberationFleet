<div class="zip-editor">
  <label class="zip-label" *ngIf="label">{{ label }}</label>
  <p class="hint-text" *ngIf="hint">{{ hint }}</p>

  <div class="zip-add-row">
    <input
      type="text"
      class="zip-draft"
      maxlength="16"
      inputmode="text"
      placeholder="Postal code"
      [(ngModel)]="draft"
      (keydown)="onDraftKeydown($event)"
      [attr.aria-invalid]="!!draftError || showError"
      [attr.aria-describedby]="draftError || showError ? 'zip-list-error' : null" />
    <button type="button" class="zip-add-btn lf-btn-secondary" (click)="addZip()">Add</button>
  </div>

  <ul class="zip-chip-list" *ngIf="zipCodes.length > 0" aria-label="Selected postal codes">
    <li class="zip-chip" *ngFor="let zip of zipCodes">
      <span>{{ zip }}</span>
      <button type="button" class="zip-remove" (click)="removeZip(zip)" [attr.aria-label]="'Remove ' + zip">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </li>
  </ul>

  <p id="zip-list-error" class="error-text" role="alert" *ngIf="draftError || showError">
    {{ draftError || errorText }}
  </p>
</div>
