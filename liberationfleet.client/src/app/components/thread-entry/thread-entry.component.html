<article class="thread-entry" [class.compact]="compact">
  <p class="thread-entry-meta">
    <app-author-identity
      [anonymous]="anonymous"
      [userId]="authorUserId"
      [username]="authorName"
      [avatarResourceId]="avatarResourceId"
      [crewId]="crewId"
      [fleetId]="fleetId"
      [linkScope]="linkScope"
      [nameAsStrong]="true"
      size="sm">
    </app-author-identity>
    <span *ngIf="createdAt">·</span>
    <span *ngIf="createdAt">{{ createdAt | date:'short' }}</span>
  </p>
  <p class="thread-entry-body" *ngIf="body">
    <app-mention-text [text]="body" />
  </p>
</article>
