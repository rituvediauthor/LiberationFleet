<div class="attachment-picker">
  <div class="attachment-actions" *ngIf="canAddMore">
    <label
      class="attach-btn attach-icon-btn"
      aria-label="Attach file"
      title="Attach file"
      (mousedown)="$event.preventDefault()">
      <i class="fa-solid fa-paperclip" aria-hidden="true"></i>
      <input
        type="file"
        [attr.accept]="resolvedAcceptTypes"
        [multiple]="maxAttachments !== 1"
        hidden
        (click)="onFileInputClick()"
        (change)="onFileSelected($event)"
        (cancel)="onFileInputCancel()" />
    </label>
    <button
      type="button"
      class="attach-btn attach-icon-btn"
      *ngIf="canRecordAudio && !audioRecorder.isRecording"
      aria-label="Record audio"
      title="Record audio"
      (mousedown)="$event.preventDefault()"
      (click)="startRecording()">
      <i class="fa-solid fa-microphone" aria-hidden="true"></i>
    </button>
  </div>

  <div class="recording-panel" *ngIf="canRecordAudio && audioRecorder.isRecording">
    <span class="recording-indicator" role="status">Recording {{ audioRecorder.formatElapsed() }} / 3:00</span>
    <button type="button" class="attach-btn stop-btn" (mousedown)="$event.preventDefault()" (click)="stopRecording()">Stop</button>
    <button type="button" class="attach-btn cancel-btn" (mousedown)="$event.preventDefault()" (click)="cancelRecording()">Cancel</button>
  </div>

  <ul class="attachment-list" *ngIf="attachments.length > 0">
    <li *ngFor="let attachment of attachments; let i = index" [class.is-processing]="attachment.status === 'processing' || attachment.status === 'uploading'" [class.is-error]="attachment.status === 'error'">
      <div class="attachment-main">
        <img
          *ngIf="chipPreviewUrl(attachment) as preview"
          class="attachment-preview"
          [src]="preview"
          alt="">
        <span class="attachment-icon" *ngIf="attachment.type === 'video' && !chipPreviewUrl(attachment)" aria-hidden="true">
          <i class="fa-solid fa-film"></i>
        </span>
        <span class="attachment-icon" *ngIf="attachment.type === 'audio'" aria-hidden="true">
          <i class="fa-solid fa-microphone"></i>
        </span>

        <div class="attachment-meta">
          <span class="attachment-name">{{ attachmentLabel(attachment) }}</span>
          <div class="progress-block" *ngIf="attachment.status === 'processing' || attachment.status === 'uploading'">
            <div class="progress-track" role="progressbar" [attr.aria-valuenow]="progressPercent(attachment)" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-fill" [style.width.%]="progressPercent(attachment)"></div>
            </div>
            <span class="progress-label">{{ attachment.progressLabel || 'Processing…' }} {{ progressPercent(attachment) }}%</span>
          </div>
          <span class="progress-label error" *ngIf="attachment.status === 'error'">
            {{ attachment.progressLabel || 'Failed' }} — remove and try again
          </span>
        </div>
      </div>

      <button
        type="button"
        class="remove-btn"
        *ngIf="attachment.status === 'processing' || attachment.status === 'uploading'"
        [attr.aria-label]="'Cancel ' + attachmentLabel(attachment)"
        (mousedown)="$event.preventDefault()"
        (click)="cancelAttachment(i)">Cancel</button>
      <button
        type="button"
        class="remove-btn"
        *ngIf="attachment.status !== 'processing' && attachment.status !== 'uploading'"
        [attr.aria-label]="'Remove ' + attachmentLabel(attachment)"
        (mousedown)="$event.preventDefault()"
        (click)="removeAttachment(i)">Remove</button>
    </li>
  </ul>
</div>
