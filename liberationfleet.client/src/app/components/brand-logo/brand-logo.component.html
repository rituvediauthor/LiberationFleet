<span
  class="brand-logo"
  [class.size-sm]="size === 'sm'"
  [class.size-md]="size === 'md'"
  [class.size-lg]="size === 'lg'"
  [class.has-custom]="!!customSrc"
  [class.monochrome]="useGreyscale"
  [class.themed]="useThemedMask"
  [style.--lf-brand-mask]="maskImage">
  <img
    class="logo-image"
    [src]="resolvedSrc"
    [alt]="resolvedAlt"
    decoding="async">
</span>
