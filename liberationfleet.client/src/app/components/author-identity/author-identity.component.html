@if (profileLink; as link) {
  <a
    class="author-identity author-identity-link"
    [routerLink]="link"
    [attr.aria-label]="'View ' + label + ' profile'"
    (click)="onLinkClick($event)">
    <app-user-avatar
      [anonymous]="anonymous"
      [resourceId]="avatarResourceId"
      [crewId]="crewId"
      [fleetId]="fleetId"
      [fallbackInitial]="anonymous ? '' : label"
      [size]="size"
      [alt]="anonymous ? '' : (label ? label + ' avatar' : '')">
    </app-user-avatar>
    @if (nameAsStrong) {
      <strong>{{ label }}</strong>
    } @else {
      <span class="author">{{ label }}</span>
    }
  </a>
} @else {
  <span class="author-identity">
    <app-user-avatar
      [anonymous]="anonymous"
      [resourceId]="avatarResourceId"
      [crewId]="crewId"
      [fleetId]="fleetId"
      [fallbackInitial]="anonymous ? '' : label"
      [size]="size"
      [alt]="anonymous ? '' : (label ? label + ' avatar' : '')">
    </app-user-avatar>
    @if (nameAsStrong) {
      <strong>{{ label }}</strong>
    } @else {
      <span class="author">{{ label }}</span>
    }
  </span>
}
