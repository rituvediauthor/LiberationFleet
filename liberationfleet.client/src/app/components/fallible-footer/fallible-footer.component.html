<footer class="fallible-footer" aria-label="Liberation Fleet footer">
  <ng-container *ngIf="showAttribution$ | async">
    <button
      type="button"
      class="fallible-box-btn"
      aria-label="Open Fallible documentation"
      (click)="onImageClick()">
      <img
        class="fallible-image"
        src="assets/images/FallibianBox.png"
        alt=""
        width="48"
        height="48" />
    </button>
    <p class="fallible-caption">Brought to you by the Fallible</p>
  </ng-container>
  <a
    class="fallible-link fallible-guide"
    href="https://docs.google.com/document/d/1CZbCpjGc7H88N0wB14WhsY96PjEApncbBCSUAsSVLZY/edit?usp=sharing"
    target="_blank"
    rel="noopener noreferrer">
    Guide to run a crew without the app
  </a>
  <hr class="fallible-link-rule" aria-hidden="true" />
  <a href="/app/donate" class="fallible-link fallible-donate" (click)="onDonateClick($event)">Donate to Liberation Fleet Co.</a>
</footer>
